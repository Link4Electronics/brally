name: Release

# Secrets: TGR_ROM_URL, BOSS_RALLY_BIN_URL, BOSS_RALLY_DLL_URL (required);
# BOSS_RALLY_CUE_URL, ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (optional).

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install clang bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev python3-clang
          libclang="$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' -print -quit)"
          [ -n "$libclang" ] || libclang="$(find /usr/lib -maxdepth 3 -name 'libclang*.so*' -print -quit)"
          [ -n "$libclang" ] && echo "LIBCLANG_LIBRARY_FILE=$libclang" >> "$GITHUB_ENV"

      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fetch game data
        env:
          TGR_ROM_URL: ${{ secrets.TGR_ROM_URL }}
          BOSS_RALLY_BIN_URL: ${{ secrets.BOSS_RALLY_BIN_URL }}
          BOSS_RALLY_CUE_URL: ${{ secrets.BOSS_RALLY_CUE_URL }}
          BOSS_RALLY_DLL_URL: ${{ secrets.BOSS_RALLY_DLL_URL }}
        run: sh .github/scripts/fetch-game-data.sh

      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(git rev-parse --short HEAD)"
          fi
          echo "RM_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "RM_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx4g
        run: |
          set -eu
          args=
          suffix=-debug
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export RM_KEYSTORE="$RUNNER_TEMP/release.jks"
            export RM_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export RM_KEY_ALIAS="$ANDROID_KEY_ALIAS"
            export RM_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            args=--release
            suffix=
          fi
          sh ports/remastered/android/build.sh \
            --rom "$PWD/reference/tgrally/Top Gear Rally (USA).z64" \
            --bin "$PWD/reference/brally/BossRally.BIN" $args
          mkdir -p dist
          apk="$(find build/remastered/android-vulkan -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "dist/TopGearRallyRemastered-${RM_VERSION_NAME}${suffix}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Android
          path: dist/*.apk
          if-no-files-found: error

  appimage:
    name: AppImage ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    defaults:
      run:
        shell: sh
    steps:
      - uses: pkgforge-dev/anylinux-setup-action@v2

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch game data
        env:
          TGR_ROM_URL: ${{ secrets.TGR_ROM_URL }}
          BOSS_RALLY_BIN_URL: ${{ secrets.BOSS_RALLY_BIN_URL }}
          BOSS_RALLY_CUE_URL: ${{ secrets.BOSS_RALLY_CUE_URL }}
          BOSS_RALLY_DLL_URL: ${{ secrets.BOSS_RALLY_DLL_URL }}
        run: |
          command -v curl >/dev/null 2>&1 || pacman -Syu --noconfirm curl
          sh .github/scripts/fetch-game-data.sh

      - name: Make AppImage
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          for attempt in 1 2 3; do
            rm -rf AppDir dist
            if sh ports/remastered/make-appimage.sh; then
              exit 0
            fi
            echo "AppImage build attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  release:
    needs: [android, appimage]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.AppImage
            artifacts/**/*.zsync
          generate_release_notes: true
